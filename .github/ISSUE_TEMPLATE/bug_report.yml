name: Bug report
description: Report a reproducible problem with the Sprites plugin for OpenClaw.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Include only redacted configuration and logs. For security vulnerabilities, use the private contact in SECURITY.md.
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: The installed openclaw-sprites package version or Git commit.
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: openclaw-version
    attributes:
      label: OpenClaw version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Gateway environment
      description: Operating system, Node.js version, and how the OpenClaw Gateway is run.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include relevant sandbox settings with tokens and private data removed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include relevant redacted error output.
    validations:
      required: true
